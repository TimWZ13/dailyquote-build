name: Cloud Build Mac DMG
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15  # macOS15 + 自带Xcode16.4，原生支持openSettings
    steps:
      - uses: actions/checkout@v6

      - name: 环境确认（防路径错）
        run: |
          echo "==== 当前目录文件 ===="
          ls -la
          echo "==== Xcode版本 ===="
          xcodebuild -version
          echo "==== 确认Package.swift存在 ===="
          ls Package.swift

      - name: 编译双架构通用版
        run: |
          swift build --configuration release --arch arm64 --arch x86_64

      - name: 查看编译产物
        run: ls -la .build/apple/Products/Release/

      - name: 组装Mac App安装包
        run: |
          # 创建标准Mac App目录结构
          rm -rf Trigin6Quote.app
          mkdir -p Trigin6Quote.app/Contents/MacOS
          mkdir -p Trigin6Quote.app/Contents/Resources

          # 找到编译好的主二进制文件
          BIN=$(find .build -name Trigin6Quote -type f -path "*release*" | head -1)
          cp "$BIN" Trigin6Quote.app/Contents/MacOS/

          # 写入标准Info.plist
          echo "" | base64 -d > Trigin6Quote.app/Contents/Info.plist

          # 把编译好的资源bundle（图标、图片等）拷进App
          RES_BUNDLE=$(find .build -name "*.bundle" -type d | head -1)
          if [ -n "$RES_BUNDLE" ]; then
            cp -R "$RES_BUNDLE" Trigin6Quote.app/Contents/Resources/
          fi

      - name: 生成可安装DMG镜像
        run: |
          rm -rf dmg_root
          mkdir dmg_root
          cp -R Trigin6Quote.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname Trigin6Quote -srcfolder dmg_root -ov -format UDZO Trigin6Quote.dmg

      - name: 上传DMG成品（Actions页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: Trigin6Quote_Mac安装包
          path: Trigin6Quote.dmg
