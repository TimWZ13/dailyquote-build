name: Cloud Build Mac DMG
on: push

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6

      - name: Show working directory & files (debug)
        run: |
          pwd
          ls -la
          ls -la DailyQuote/

      - name: Build Swift Release (arm64 + x86_64 universal)
        working-directory: ./DailyQuote
        run: |
          swift build --configuration release --arch arm64 --arch x86_64

      - name: Locate built .app
        working-directory: ./DailyQuote
        run: |
          ls -la .build/apple/Products/Release/

      - name: Create DMG
        working-directory: ./DailyQuote
        run: |
          APP_PATH=".build/apple/Products/Release/Trigin6Quote.app"
          DMG_NAME="Trigin6Quote.dmg"
          hdiutil create -volname "Trigin6Quote" -srcfolder "$APP_PATH" -ov -format UDZO "../$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trigin6Quote-DMG
          path: ./DailyQuote/Trigin6Quote.dmg
