name: Cloud Build Mac DMG
on: push
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Build Swift Release
        run: |
          swift build --configuration release --arch arm64 --arch x86_64

      - name: Assemble Mac App Bundle
        run: |
          mkdir -p Trigin6Quote.app/Contents/MacOS
          mkdir -p Trigin6Quote.app/Contents/Resources
          cp .build/apple/Products/Release/Trigin6Quote Trigin6Quote.app/Contents/MacOS/

          cat > Trigin6Quote.app/Contents/Info.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>Trigin6Quote</string>
    <key>CFBundleIdentifier</key>
    <string>com.dailyquote.app</string>
    <key>CFBundleName</key>
    <string>Trigin6Quote</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>LSMinimumSystemVersion</key>
    <string>13.0</string>
    <key>NSHighResolutionCapable</key>
    <true/>
</dict>
</plist>
EOF
          cp -r Trigin6Quote/Resources/* Trigin6Quote.app/Contents/Resources/ || true

      - name: Build Standard Install DMG
        run: |
          mkdir dmg_root
          cp -R Trigin6Quote.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname Trigin6Quote -srcfolder dmg_root -ov -format UDZO Trigin6Quote.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trigin6Quote_Install_DMG
          path: Trigin6Quote.dmg
