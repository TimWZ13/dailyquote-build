name: Build DailyQuote DMG
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcode-select -p && xcodebuild -version

      - name: Build universal arm64+x86_64
        run: |
          cd DailyQuote
          xcodebuild -scheme Trigin6Quote -configuration Release \
            -destination 'platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0

      - name: Create DMG
        run: |
          cd DailyQuote
          mkdir -p ./dmg/
          cp -R ./build/Release/Trigin6Quote.app ./dmg/
          hdiutil create -volname Trigin6Quote -srcfolder ./dmg -ov -format UDZO Trigin6Quote.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trigin6Quote-DMG
          path: DailyQuote/Trigin6Quote.dmg
